   <div class="sh-note">${skillSummary().demo.length?`<b>${skillSummary().demo.length}</b> skill${skillSummary().demo.length===1?'':'s'} shown on their own`:'No skills shown on their own yet'}. Lessons finished show effort. This count only includes skills answered right without help, on different questions, on different days.</div>
   <h3>Special stickers: ${got} of ${BADGES.length}</h3><div class="sh-badges">${BADGES.map(b=>{const on=S.badges[b[0]];return `<div class="sh-b ${on?'':'off'}"><span class="em">${on?b[1]:'🔒'}</span>${esc(b[2])}</div>`}).join('')}</div>
   <h3>Lesson stickers</h3>${lands}
   <div class="sh-sign"><span>Signed by</span><span>Date</span></div></div>
   <div class="sh-actions noprint"><button class="gobtn" data-act="printsheet">🖨️ Print or save as PDF</button><button class="btn ghost" data-act="stay">Close</button></div>`;
  $('#modal').classList.add('sheetmode');$('#modal').hidden=false;$('#mbox').scrollTop=0;
}


/* ===================== grown-up report ===================== */
/** Groups lessons by what the evidence so far suggests. A rough guide only. */
function skillSummary(){
  const g={demo:[],practicing:[],help:[],refresh:[]};
  ALL.forEach(l=>{
    if(l.make)return;
    const m=masteryOf(l.id);
    if(m==='demonstrating')g.demo.push(l);else if(m==='review')g.refresh.push(l);
    else if(m==='practicing')g.practicing.push(l);else if(m==='emerging')g.help.push(l);
  });
  return g;
}
function reportModal(){
  const g=skillSummary(),stars=Object.values(S.done).reduce((n,d)=>n+d.stars,0);
  const list=(arr,none)=>arr.length?`<ul class="rp-list">${arr.slice(0,8).map(l=>`<li>${esc(l.title)} <small>Land ${l.ch+1}</small></li>`).join('')}${arr.length>8?`<li><small>and ${arr.length-8} more</small></li>`:''}</ul>`:`<p class="rp-none">${none}</p>`;
  const days=[];for(let i=-13;i<=0;i++){const k=ds(dayOff(i));days.push([k,S.days[k]||0])}
  const active=days.filter(d=>d[1]).length,mx=Math.max(1,...days.map(d=>d[1]));
  const bars=active>=3?`<div class="rp-bars" role="img" aria-label="Lessons finished per day over the last 14 days">${days.map(d=>`<i style="height:${6+d[1]/mx*34}px" class="${d[1]?'on':''}"></i>`).join('')}</div><small>Lessons finished each day, last 14 days (${active} active days)</small>`:'<p class="rp-none">A picture of recent progress will appear after a few days of learning.</p>';
  $('#mbox').innerHTML=`<div class="sheet"><div class="sh-top"><span class="sh-av">${esc(S.avatar)}</span><div><h2>Progress report</h2><div class="sh-sub">${esc(S.name||'Learner')} • ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</div></div></div>
   <div class="sh-stats"><div>📚 ${cntDone()}<small>of ${ALL.length} lessons finished</small></div><div>⭐ ${stars}<small>lesson stars</small></div><div>🌱 ${g.demo.length}<small>skills shown on their own</small></div><div>🔥 ${S.best}<small>best streak</small></div></div>
   <h3>Shown on their own</h3><p class="rp-what">Answered right without help, on different questions, on more than one day.</p>${list(g.demo,'Not enough practice yet to say. That is normal at the start.')}
   <h3>Still practicing</h3>${list(g.practicing,'Nothing here right now.')}
   <h3>May like extra practice</h3><p class="rp-what">Needed hints or several tries recently. The Practice Boost button on the home screen helps.</p>${list(g.help,'Nothing stands out right now.')}
   <h3>Coming up for a refresher</h3>${list(g.refresh,'Nothing is due.')}
   <h3>Recent progress</h3>${bars}
   <p class="rp-note">This comes from a small number of answers, so it is only a rough guide. It is not a test result and does not describe what ${esc(S.name||'your child')} can do in the future. A finished lesson means it was completed, not that the skill is secure.</p></div>
   <div class="sh-actions noprint"><button class="gobtn" data-act="printsheet">🖨️ Print or save as PDF</button><button class="btn ghost" data-act="stay">Close</button></div>`;
  $('#modal').classList.add('sheetmode');$('#modal').hidden=false;$('#mbox').scrollTop=0;
}

/* ===================== events ===================== */
const closeModal=()=>{$('#modal').hidden=true;$('#modal').classList.remove('sheetmode')};
const ACT={
  go:t=>go(t.dataset.v),
  toggle:t=>{const i=+t.dataset.ch;openCh=openCh===i?-1:i;renderLearn()},
  open:t=>{const l=ALL[+t.dataset.i];if(!unlocked(l)){toast('Finish the lesson before this one first!');return}startLesson(l,'lesson')},
  continue:()=>{const l=nextLesson();if(l)startLesson(l,'lesson')},
  boost:()=>startBoost(),
  memory:()=>startMemory(),
  askhint:()=>askHint(),
  hearwhy:()=>{const q=P&&P.qs[P.i];const w=q&&Teach.info(q,P.story).why;if(w)TTS.speak(w)},
  hearworked:()=>{const q=P&&P.qs[P.i];const w=q&&Teach.info(q,P.story).worked;if(w)TTS.speak(w)},
  report:()=>reportModal(),
  switcher:()=>switcherModal(),
  newkid:()=>profileModal('new'),
  pick:t=>{
    const id=t.dataset.id;closeModal();
    if(id!==DB.active){switchProfile(id);renderAll();window.scrollTo(0,0);TTS.speak('Hi '+(S.name||'friend')+'! Welcome back!',true)}
  },
  sheet:()=>rewardSheet(),
  printsheet:()=>{try{window.print()}catch(e){toast('Please take a screenshot instead.')}},
  skipintro:()=>{
    if(!tapOK())return;
    if(P.mode==='warm'){startLesson(P.after,'lesson',null,{noWarm:true});return}
    closeLesson();                                       // starter quiz skipped (closeLesson marks it as done)
  },
  redopre:()=>gate(()=>startPretest(),'This finds the best starting land again.'),
  remove:()=>gate(()=>{
    $('#mbox').innerHTML=`<div class="owl-m">${owl()}</div><h2>Remove ${esc(S.name||'this learner')}?</h2><p>This erases ${cntDone()} finished lessons, ${S.xp} stars, stickers, flames and practice history for good. Other learners are not touched. It cannot be undone.</p><button class="gobtn" data-act="stay">No, keep them</button><button class="btn ghost" data-act="doremove">Yes, remove</button>`;
    $('#modal').hidden=false;
  },'This removes a learner for good.'),
  doremove:()=>{if(removeActiveProfile()){closeModal();renderAll();toast('Learner removed')}else closeModal()},
  play:t=>playGame(t.dataset.k),
  hibuddy:()=>TTS.speak('Hi '+(S.name||'friend')+'! I am Ollie. Press the big green button to start learning!',true),
  buddy:()=>Buddy.replay(),
  sayintro:()=>TTS.speak(P.l.intro,!!P.l.local),
  saycard:t=>TTS.speak(P.l.cards[+t.dataset.k][2]),
  begin:()=>{if(!tapOK())return;P.phase='q';hold(350);renderLP()},
  opt:t=>onOpt(t),tile:t=>onTile(t),confirm:()=>confirmAns(),
  hear:()=>TTS.speak(P.qs[P.i].say),
  hearopts:()=>TTS.speak(P.qs[P.i].opts.join(', ')),
  readstory:()=>TTS.speak(P.story),
  next:()=>nextQ(),
  close:()=>askLeave(),
  stay:()=>closeModal(),
  leave:()=>{const saved=P&&P.mode==='lesson'&&P.phase==='q'&&P.i>0;closeModal();closeLesson();if(saved)toast('Saved! You can keep going later.')},
  finishclose:()=>{if(tapOK())closeLesson()},
  nextlesson:()=>{if(!tapOK())return;const l=ALL[P.l.idx+1];closeLesson();if(l)setTimeout(()=>startLesson(l,'lesson'),60)},
  soundtoggle:()=>{S.sound=!S.sound;if(!S.sound)TTS.stop();save();renderMe()},
  captoggle:()=>{S.captions=!S.captions;save();renderMe()},
  teachertoggle:()=>{
    if(S.teacher){S.teacher=false;save();renderMe();toast('Teacher mode off');return}
    gate(()=>{S.teacher=true;save();renderMe();toast('Teacher mode: all lessons unlocked')},'Teacher mode unlocks every lesson.');
  },
  ttsretry:()=>{toast('Looking for the voice server...');TTS.retry().then(()=>{renderMe();toast(TTS.online?'Edge voices are connected!':'Still using the device voice.')})},
  testvoice:()=>TTS.speak('Hello '+(S.name||'friend')+'! I am Ollie, your reading buddy. Let us learn together!',true),
  reset:()=>gate(()=>{
    $('#mbox').innerHTML=`<div class="owl-m">${owl()}</div><h2>Start over for ${esc(S.name||'this learner')}?</h2><p>This erases ${cntDone()} finished lessons, ${S.xp} stars, all stickers, flames and practice history. The name and friend stay. It cannot be undone.</p><button class="gobtn" data-act="stay">No, keep everything</button><button class="btn ghost" data-act="doreset">Yes, erase it</button>`;
    $('#modal').hidden=false;
  },'This erases all progress.'),
  doreset:()=>{resetActiveProfile();closeModal();renderAll();toast('All fresh and new!');setTimeout(startPretest,300)},
  gateopt:t=>{closeModal();if(+t.dataset.v===gateAns){const cb=gateCb;gateCb=null;if(cb)cb()}else toast('Not quite. Ask a grown-up to help!')},
  gatecancel:()=>closeModal(),
  editprofile:()=>profileModal('edit'),
  pickav:t=>{document.querySelectorAll('.avs button').forEach(b=>b.classList.toggle('on',b===t))},
  saveprofile:()=>{
    const nm=$('#in-name').value.trim(),sel=document.querySelector('.avs button.on');
    if(!nm){toast('Please type your name');return}
    const av=sel?sel.dataset.a:S.avatar;
    if(profMode==='new')addProfile(nm,av);else{S.name=nm;S.avatar=av;save()}
    closeModal();renderAll();
    if(profMode!=='edit'&&!S.pre)setTimeout(startPretest,250);
    else TTS.speak('Hi '+nm+'! Let us start learning!',true);
  }
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]&&!t.disabled)ACT[t.dataset.act](t,e)});
document.addEventListener('change',e=>{
  if(e.target.id==='sel-voice'){S.voice=e.target.value;save();TTS.speak('Hello, I am your new voice.')}
  if(e.target.id==='sel-rate'){S.rate=e.target.value;save();TTS.speak('This is how fast I speak.')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='in-name')ACT.saveprofile();
  if(e.key==='Escape'){
    if(!$('#modal').hidden)closeModal();
    else if(P&&!$('#lesson').hidden)askLeave();
  }
  if(e.key==='Tab'&&!$('#modal').hidden){                 // keep keyboard focus inside the open dialog
    const f=[...$('#mbox').querySelectorAll('button:not([disabled]),input,select')].filter(x=>x.offsetParent!==null);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(!$('#mbox').contains(document.activeElement)){e.preventDefault();first.focus()}
    else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
/* dialogs: move focus in when they open and give it back when they close */
let modalOpener=null;
new MutationObserver(()=>{
  const m=$('#modal');
  if(!m.hidden){
    if(!modalOpener)modalOpener=document.activeElement;
    setTimeout(()=>{const f=$('#mbox').querySelector('input,.gobtn,button');if(f&&!m.hidden)f.focus({preventScroll:true})},30);
  }else if(modalOpener){
    try{if(document.contains(modalOpener))modalOpener.focus({preventScroll:true})}catch(e){}
    modalOpener=null;
  }
}).observe($('#modal'),{attributes:true,attributeFilter:['hidden']});
document.addEventListener('contextmenu',e=>{if(!/INPUT|TEXTAREA/.test(e.target.nodeName))e.preventDefault()});
window.addEventListener('popstate',()=>{if(P&&!$('#lesson').hidden){try{history.pushState({lesson:1},'')}catch(e){}askLeave()}});
try{new ResizeObserver(()=>{const h=$('#lp-footwrap').offsetHeight;if(h)document.documentElement.style.setProperty('--fh',h+'px')}).observe($('#lp-footwrap'))}catch(e){}

/* ===================== boot ===================== */
window.StepUp={state:()=>S,player:()=>P,all:ALL,act:ACT};
Art.start();
$('#logo').innerHTML=owl();$('#b-body').innerHTML=owl();
renderAll();
if(!S.name)profileModal('first');else if(!S.pre)setTimeout(startPretest,400);
TTS.check();
if(dbNotice)setTimeout(()=>toast(dbNotice),600);
</script>
</body>
</html>
