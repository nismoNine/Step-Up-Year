<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BDE6FF">
<title>Step Up Year – Learn to Read and Count</title>
<meta name="description" content="A friendly catch-up adventure for children ages 5–10: 5 lands, 75 lessons, a talking owl buddy, stickers and games.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8E7;--ink:#33405E;--muted:#66728F;--line:#EBDFC4;
  --blue:#4FB3F0;--blue-s:#DDF1FF;--blue-d:#2A86C4;
  --yellow:#FFD34E;--yellow-s:#FFF1BF;--yellow-d:#C99A12;
  --green:#6FD08C;--green-s:#DDF6E4;--green-d:#3E9F5B;
  --coral:#FF8A78;--coral-s:#FFE3DD;--coral-d:#D4583F;
  --purple:#B28CF0;--purple-s:#ECE3FD;--purple-d:#7D58C4;
  --pink:#FF9EC4;--pink-s:#FFE4EF;--orange:#FFA64D;
  --nav:74px;--top:60px;--sh:0 6px 0 rgba(51,64,94,.13);--fh:96px;
}
.c1{--c:var(--blue);--cs:var(--blue-s);--cd:var(--blue-d)}
.c2{--c:var(--green);--cs:var(--green-s);--cd:var(--green-d)}
.c3{--c:var(--yellow);--cs:var(--yellow-s);--cd:var(--yellow-d)}
.c4{--c:var(--coral);--cs:var(--coral-s);--cd:var(--coral-d)}
.c5{--c:var(--purple);--cs:var(--purple-s);--cd:var(--purple-d)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font-family:"Fredoka","Baloo 2","Nunito","Chalkboard SE","Comic Sans MS",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:500;
  background:#FFF8E7 linear-gradient(#BDE6FF 0,#DDF3FF 230px,#FFF8E7 520px) no-repeat;color:var(--ink);line-height:1.45;font-size:18px;
  padding-top:calc(var(--top) + env(safe-area-inset-top));padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 28px);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,select{-webkit-user-select:text;user-select:text}
body.noscroll{overflow:hidden}
h1,h2,h3{line-height:1.2;font-weight:700}
p{color:var(--muted)}
b{font-weight:700}
button{font:inherit;color:var(--ink);border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
main{max-width:720px;margin:0 auto;padding:10px 14px}
.vt{font-size:1.9rem;margin:6px 0 2px}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(#BDE6FF 70%,rgba(189,230,255,0))}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem}
.logo{width:42px;height:42px;display:block}
.chips{display:flex;gap:6px}
.chip{background:#fff;border-radius:99px;padding:3px 12px 3px 8px;font-weight:700;font-size:1.02rem;white-space:nowrap;box-shadow:0 3px 0 rgba(51,64,94,.12);display:flex;align-items:center;gap:3px}
.chip.fire.off{filter:grayscale(1);opacity:.75}
@media(max-width:400px){.bt{display:none}}

/* floating bottom nav */
.bottom{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;z-index:30;background:#fff;border-radius:34px;padding:6px;display:flex;gap:4px;box-shadow:0 8px 0 rgba(51,64,94,.14),0 14px 24px rgba(51,64,94,.12)}
.bottom button{flex:1;height:calc(var(--nav) - 14px);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted);gap:0;transition:transform .15s,background .15s}
.bottom button span{font-size:1.9rem;line-height:1.1;transition:transform .2s}
.bottom button.on{color:var(--ink);background:var(--blue-s)}
.bottom button:nth-child(2).on{background:var(--yellow-s)}.bottom button:nth-child(3).on{background:var(--pink-s)}.bottom button:nth-child(4).on{background:var(--green-s)}
.bottom button.on span{transform:translateY(-3px) scale(1.12)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;padding:0 24px;border-radius:30px;font-weight:700;font-size:1.2rem;background:var(--yellow);box-shadow:var(--sh);transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn.ghost{background:#fff;box-shadow:0 5px 0 rgba(51,64,94,.1)}
.btn.sm{min-height:48px;width:auto;font-size:1rem;padding:0 20px}
.btn:disabled{background:#E4E0D4;color:#9A9684;box-shadow:none}
.card{background:#fff;border-radius:28px;padding:18px;box-shadow:var(--sh);margin-top:16px}
.card h3{font-size:1.3rem}

/* home hero */
.hero{background:#fff;border-radius:32px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-20px;top:-14px;width:150px;height:70px;background:radial-gradient(circle at 30% 60%,#EAF7FF 0 28px,transparent 29px),radial-gradient(circle at 60% 40%,#EAF7FF 0 34px,transparent 35px),radial-gradient(circle at 85% 65%,#EAF7FF 0 24px,transparent 25px);pointer-events:none}
.hrow{display:flex;gap:10px;align-items:flex-end;position:relative}
.owl-hero{width:92px;height:92px;flex:0 0 auto;transform-origin:50% 100%}
.owl-hero:active{animation:hop .5s}
.bubble-hero{position:relative;background:var(--yellow-s);border-radius:22px;padding:10px 14px;margin-bottom:12px;flex:1}
.bubble-hero::before{content:"";position:absolute;left:-9px;bottom:16px;width:18px;height:18px;background:var(--yellow-s);transform:rotate(45deg);border-radius:3px}
.hi{font-size:1.4rem;font-weight:700;line-height:1.15}
.hsub{color:var(--muted);font-size:.98rem;margin-top:2px}
.week{display:flex;justify-content:space-between;gap:4px;margin:14px 0 12px}
.wd{flex:1;text-align:center;font-weight:700;font-size:.78rem;color:var(--muted)}
.wd i{display:grid;place-items:center;width:36px;height:36px;margin:3px auto 0;border-radius:50%;background:#F4EEDC;font-style:normal;font-size:1.25rem}
.wd.on i{background:var(--coral-s)}
.wd.today i{box-shadow:0 0 0 3px var(--ink)}
.gobtn,.go-big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;border-radius:34px;background:var(--green);font-weight:700;font-size:1.3rem;box-shadow:0 7px 0 var(--green-d);transition:transform .08s;padding:0 20px;text-align:center;line-height:1.15}
.gobtn:active,.go-big:active{transform:translateY(6px);box-shadow:0 1px 0 var(--green-d)}
.gobtn:disabled{background:#E4E0D4;color:#9A9684;box-shadow:0 7px 0 #CFCAB8}
.gobtn.yellow{background:var(--yellow);box-shadow:0 7px 0 var(--yellow-d)}

/* lands (chapters) */
.land{margin-top:18px;border-radius:32px;background:var(--cs);box-shadow:var(--sh);overflow:hidden}
.lhead{width:100%;display:flex;gap:12px;align-items:center;padding:14px;text-align:left}
.lbanner{width:68px;height:68px;border-radius:24px;background:#fff;display:grid;place-items:center;font-size:2.6rem;flex:0 0 auto;box-shadow:0 4px 0 rgba(51,64,94,.1)}
.ltx{flex:1;min-width:0}
.ltx small{font-weight:700;color:var(--cd);text-transform:uppercase;letter-spacing:.06em;font-size:.76rem}
.ltx b{display:block;font-size:1.25rem;line-height:1.15}
.pbar{height:14px;border-radius:99px;background:#fff;margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 8px,transparent 8px 16px)}
.lcount{font-weight:700;font-size:1.05rem;color:var(--cd)}
.chev{font-size:1.6rem;transition:transform .2s;color:var(--cd)}
.land.open .chev{transform:rotate(90deg)}
.lbody{padding:2px 12px 16px}
.lblurb{font-size:1rem;margin:4px 4px 2px}
.ribbon{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:99px;padding:6px 16px 6px 8px;margin:16px 0 10px;font-weight:700;box-shadow:0 3px 0 rgba(51,64,94,.1)}
.ribbon small{color:var(--muted);font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.lgrid{grid-template-columns:repeat(3,1fr)}}
.lcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-height:168px;padding:14px 8px 10px;border-radius:26px;background:#fff;text-align:center;box-shadow:0 5px 0 rgba(51,64,94,.12);border:4px solid #fff;transition:transform .1s}
.lcard:active{transform:translateY(4px);box-shadow:none}
.li{width:76px;height:76px;border-radius:50%;background:var(--cs);display:grid;place-items:center;font-size:3rem}
.lt{font-weight:700;font-size:1.02rem;line-height:1.15}
.lstars{font-size:1.25rem;letter-spacing:1px;margin-top:auto}
.lcard.done{background:var(--cs);border-color:var(--c)}
.lcard.done .li{background:#fff}
.lcard.cur{border-color:var(--c);animation:bob 1.4s ease-in-out infinite}
.lcard.cur .tagGo{position:absolute;top:-10px;right:-6px;background:var(--coral);color:#fff;font-weight:700;border-radius:99px;padding:2px 12px;font-size:.9rem;box-shadow:0 3px 0 var(--coral-d)}
.lcard.locked{background:#F1EEE4;box-shadow:none;border-color:transparent}
.lcard.locked .li{background:#E5E1D2;filter:grayscale(1);opacity:.7;font-size:2.4rem}
.lcard.locked .lt{color:#8B8873}
.lcard .rs{font-size:.85rem;color:var(--coral-d);font-weight:700}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{30%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
@keyframes wiggle{20%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}

/* play, stickers, me */
.gcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:30px;background:#fff;box-shadow:var(--sh);margin-top:16px;transition:transform .08s}
.gcard:active{transform:translateY(5px);box-shadow:none}
.ge{font-size:3rem;width:80px;height:80px;border-radius:26px;display:grid;place-items:center;flex:0 0 auto}
.gcard b{display:block;font-size:1.3rem}.gcard small{color:var(--muted);font-size:1rem}
.tagx{display:inline-block;background:var(--yellow);border-radius:99px;font-size:.85rem;padding:1px 12px;font-weight:700;margin-top:6px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media(min-width:560px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.stk{background:#fff;border-radius:26px;padding:12px 6px;text-align:center;box-shadow:var(--sh);font-weight:700;font-size:.88rem;line-height:1.15}
.stk .em{font-size:2.8rem;display:block;margin:0 auto 4px}
.stk small{display:block;font-weight:500;color:var(--muted);font-size:.74rem;margin-top:3px}
.stk.off{background:transparent;box-shadow:none;border:4px dashed #D9CFB4;color:#A79E85}
.stk.off .em{opacity:.35;filter:grayscale(1)}
.mini-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.ms{aspect-ratio:1;border-radius:50%;background:var(--cs);display:grid;place-items:center;font-size:1.7rem}
.ms.off{background:transparent;border:3px dashed #D9CFB4}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.stat{border-radius:26px;padding:14px;text-align:center;background:#fff;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.7rem}.stat small{color:var(--muted);font-weight:600}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:3px dotted var(--line)}
.set label,.set .l{font-weight:700}
select,input[type=text]{font:inherit;font-weight:600;padding:8px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);min-height:48px;max-width:60%}
.sw{width:68px;height:38px;border-radius:99px;background:#D6D2C3;position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.sw.on{background:var(--green)}.sw.on::after{left:34px}
.status{font-size:.95rem;border-radius:16px;padding:10px 14px;margin-top:8px;font-weight:600;display:flex;gap:8px;align-items:center}
.status.ok{background:var(--green-s)}.status.no{background:var(--yellow-s)}
.mission li{margin:6px 0 6px 20px;color:var(--muted)}

/* lesson player */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;height:100vh;height:100dvh;background:linear-gradient(#BDE6FF 0,#E4F6FF 200px,#FFF8E7 460px) #FFF8E7}
.lp-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.lp-x{width:48px;height:48px;border-radius:50%;background:#fff;font-size:1.3rem;flex:0 0 auto;box-shadow:0 4px 0 rgba(51,64,94,.12)}
.lp-x:active{transform:translateY(3px);box-shadow:none}
.pstars{flex:1;display:flex;justify-content:center;gap:4px;font-size:1.9rem}
.pstars span{display:inline-block;transition:transform .3s}
.pstars span.cur{animation:bob 1s ease-in-out infinite}
.pstars span.off{opacity:.9}
.lp-sp{width:48px;flex:0 0 auto}
.lp-body{flex:1;overflow:auto;padding:8px 16px 175px;max-width:640px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.lp-foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,248,231,0),#FFF8E7 30%)}
.lp-foot .in{max-width:640px;margin:0 auto}
.hint{text-align:center;font-weight:700;color:var(--coral-d);min-height:1.6em;padding-bottom:6px}
.teach{text-align:center;padding-top:8px}
.te{font-size:5.5rem;width:140px;height:140px;margin:0 auto;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh)}
.teach h2{font-size:1.9rem;margin:12px 0 6px}
.intro{font-size:1.2rem;color:var(--ink);margin:6px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:18px}
.tcard{background:#fff;border-radius:24px;padding:14px 6px;box-shadow:var(--sh);transition:transform .08s}
.tcard b{display:block;font-size:2rem;line-height:1.25}.tcard span{font-weight:600;color:var(--muted);font-size:1rem}
.tcard:active{transform:translateY(4px);box-shadow:none}
.story{background:var(--yellow-s);border-radius:24px;padding:14px 16px;margin:6px 0 14px;font-size:1.12rem}
.st-t{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:4px}
.story p{color:var(--ink)}
.mini{width:44px;height:44px;border-radius:50%;background:var(--blue);font-size:1.3rem;box-shadow:0 4px 0 var(--blue-d)}
.qcard{background:#fff;border-radius:30px;padding:16px;box-shadow:var(--sh)}
.qrow{display:flex;gap:12px;align-items:center}
.spk{width:60px;height:60px;border-radius:50%;background:var(--blue);font-size:1.8rem;box-shadow:0 5px 0 var(--blue-d);flex:0 0 auto}
.spk:active{transform:translateY(4px);box-shadow:none}
.qt{font-size:1.5rem;font-weight:700}.qt.sm{font-size:1.2rem}
.vis{text-align:center;font-size:3.6rem;line-height:1.25;margin-top:12px;padding:12px 8px;background:var(--cs,var(--blue-s));border-radius:22px;white-space:pre-line;word-break:break-word;letter-spacing:.06em}
.vis.sm{font-size:2.2rem}
.vis .em{width:1.3em;height:1.3em}
.vis.sm .em{width:1.15em;height:1.15em}
.opts{display:grid;gap:14px;margin-top:18px}
.opts.short{grid-template-columns:repeat(3,1fr)}
.opt{min-height:70px;padding:10px 14px;border-radius:26px;background:var(--blue-s);border:5px solid #fff;box-shadow:var(--sh);font-weight:700;font-size:1.3rem;transition:transform .1s}
.opts.short .opt{font-size:2.3rem;min-height:98px}
.opt:nth-child(2){background:var(--yellow-s)}.opt:nth-child(3){background:var(--green-s)}.opt:nth-child(4){background:var(--pink-s)}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt.sel{border-color:var(--ink);transform:translateY(-5px) scale(1.04);box-shadow:0 10px 0 rgba(51,64,94,.2);animation:wiggle .4s}
.opt.right{background:var(--green);border-color:var(--green-d);animation:hop .6s}
.opt.wrong{opacity:.35;transform:scale(.94);animation:wiggle .4s}
.opt.hintc{border-color:var(--green-d);animation:bob 1s infinite}
.hearopts{display:flex;margin:16px auto 0}
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 22px}
.slot{width:54px;height:64px;border-radius:18px;border-bottom:6px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:2rem;font-weight:700}
.slot.ok{background:var(--green-s);border-color:var(--green-d)}
.tiles{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.tile{width:66px;height:70px;border-radius:22px;background:var(--yellow);box-shadow:var(--sh);font-size:2rem;font-weight:700}
.tile:active{transform:translateY(5px);box-shadow:none}
.tile.used{opacity:.2;pointer-events:none}
.tile.bad{animation:wiggle .4s;background:var(--coral-s)}
.result{text-align:center;padding-top:4px}
.sticker{width:160px;height:160px;border-radius:50%;background:#fff;border:9px solid var(--yellow);box-shadow:var(--sh),0 0 0 6px #fff;display:grid;place-items:center;font-size:5.6rem;margin:6px auto 12px;animation:stick .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes stick{0%{transform:scale(0) rotate(-120deg)}100%{transform:scale(1) rotate(-6deg)}}
.rstars{font-size:2.8rem;letter-spacing:4px}
.result h2{font-size:2rem;margin:2px 0 4px}
.rstats{display:flex;gap:10px;margin:14px 0}
.rstats div{flex:1;background:#fff;border-radius:22px;padding:10px 4px;box-shadow:var(--sh);font-weight:700;font-size:1.2rem}
.rstats small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.sbox{background:var(--coral-s);border-radius:28px;padding:14px;margin-top:12px}
.sbox .big{font-size:2.8rem;font-weight:700;line-height:1.1}
.sbox.up .big{animation:pop 0.7s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.newb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.newb span{background:#fff;border-radius:99px;padding:6px 16px;font-weight:700;box-shadow:0 3px 0 rgba(51,64,94,.12)}
.foot2{display:grid;gap:12px}

/* buddy */
.buddy{position:fixed;left:8px;right:8px;z-index:60;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 22px);display:flex;align-items:flex-end;gap:4px;pointer-events:none}
body.inlesson .buddy{bottom:calc(var(--fh) - 8px)}
.b-body{pointer-events:auto;width:92px;height:92px;flex:0 0 auto;transform-origin:50% 100%;filter:drop-shadow(0 4px 0 rgba(51,64,94,.12))}
.b-body svg{width:100%;height:100%;display:block;overflow:visible}
.b-wrap{pointer-events:auto;position:relative;margin:0 0 26px 6px;background:#fff;border-radius:24px;box-shadow:var(--sh);max-width:calc(100% - 106px)}
.b-wrap::before{content:"";position:absolute;left:-9px;bottom:16px;width:20px;height:20px;background:#fff;transform:rotate(45deg);border-radius:4px}
.b-text{position:relative;max-height:4.3em;overflow:auto;padding:10px 16px;font-weight:600;font-size:1.12rem;line-height:1.4}
.b-text .w{color:#9AA3B8;transition:color .1s}
.b-text .w.done{color:var(--ink)}
.b-text .w.cur{color:var(--ink);background:var(--yellow);border-radius:8px;padding:0 4px;margin:0 -4px}
.b-eyes{transform-origin:50px 45px;transform-box:view-box;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.b-jaw{transform-box:view-box}
.buddy.talking .b-jaw{animation:yap .22s ease-in-out infinite alternate}
@keyframes yap{to{transform:translateY(3.5px)}}
.buddy.talking .b-body{animation:talkbob .5s ease-in-out infinite alternate}
@keyframes talkbob{to{transform:rotate(-3deg)}}
.buddy.happy .b-body{animation:hop .7s}
.buddy.oops .b-body{animation:wiggle .6s}

/* celebration pop */
.pop{position:fixed;inset:0;z-index:65;display:grid;place-items:end center;padding-bottom:calc(var(--fh) + 150px);pointer-events:none}
.pop div{text-align:center;font-size:2.2rem;font-weight:700;animation:popin 1s ease-out forwards}
.pop .em{font-size:5.5rem;display:block;margin:0 auto}
@keyframes popin{0%{transform:scale(.2) rotate(-20deg);opacity:0}25%{transform:scale(1.15);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.1) translateY(-30px);opacity:0}}

/* modal, toast, confetti */
.modal{position:fixed;inset:0;z-index:70;background:rgba(51,64,94,.5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--bg);border-radius:34px;padding:22px 18px;width:100%;max-width:420px;max-height:92vh;overflow:auto;text-align:center}
.mbox h2{font-size:1.7rem;margin-bottom:6px}
.mbox .owl-m{width:110px;height:110px;margin:-4px auto 6px}
.mbox .btn,.mbox .gobtn{margin-top:12px}
.mbox input{width:100%;max-width:100%;margin:14px 0;text-align:center;font-size:1.3rem}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.avs button{font-size:2rem;height:64px;border-radius:20px;background:#fff;border:4px solid #fff;box-shadow:0 3px 0 rgba(51,64,94,.1)}
.avs button.on{border-color:var(--blue);background:var(--blue-s)}
.gate-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.gate-opts button{min-height:64px;border-radius:20px;background:var(--yellow-s);font-size:1.6rem;font-weight:700;box-shadow:var(--sh)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 36px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:600;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
body.inlesson #toast{bottom:calc(var(--fh) + 150px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
#fx span{position:absolute;top:-50px;font-size:30px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- hand-drawn art ---- */
.em{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.2em;line-height:1}
.em svg,svg.ic{width:100%;height:100%;display:block;overflow:visible}
.ic .hd *{stroke:#2B3A55;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ic .hd{filter:url(#wob)}

/* learner switcher, practice boost, reward sheet */
.whorow{display:flex;justify-content:flex-end;margin:-4px 0 8px;position:relative}
.who{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 10px;border-radius:24px;background:var(--blue-s);font-weight:700;font-size:1rem;box-shadow:0 3px 0 rgba(51,64,94,.1)}
.who .wa{font-size:1.5rem;line-height:1}
.who:active{transform:translateY(3px);box-shadow:none}
.boostbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:62px;margin-top:14px;border-radius:32px;background:var(--orange);font-weight:700;font-size:1.15rem;box-shadow:0 7px 0 #D07C22;padding:6px 20px;text-align:left;line-height:1.15}
.boostbtn:active{transform:translateY(6px);box-shadow:0 1px 0 #D07C22}
.boostbtn small{display:block;font-weight:500;font-size:.85rem;margin-top:2px}
.boostbtn .bi{font-size:1.9rem;flex:0 0 auto}
.kids{display:grid;gap:10px;margin:12px 0 4px;text-align:left}
.kid{display:flex;align-items:center;gap:12px;min-height:72px;padding:8px 14px;border-radius:24px;background:#fff;border:4px solid #fff;box-shadow:0 4px 0 rgba(51,64,94,.1);text-align:left}
.kid.on{border-color:var(--green);background:var(--green-s)}
.kid .ka{font-size:2.4rem;line-height:1}
.kid b{display:block;font-size:1.2rem}.kid small{color:var(--muted);font-weight:600;font-size:.82rem}
.weak{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line);font-weight:600}
.weak:last-of-type{border:0}.weak small{color:var(--muted)}
.sheetmode .mbox{max-width:640px;text-align:left;padding:14px}
.sheet{background:#fff;border:5px solid var(--yellow);border-radius:26px;padding:16px}
.sh-top{display:flex;align-items:center;gap:12px}
.sh-av{font-size:3rem;line-height:1}
.sheet h2{font-size:1.6rem;margin:0}.sheet h3{font-size:1.1rem;margin:16px 0 6px}
.sh-sub{color:var(--muted);font-weight:700}
.sh-name{margin-top:10px;font-size:1.3rem;font-weight:700;border-bottom:3px dotted var(--line);padding-bottom:6px}
.sh-name small{color:var(--muted);font-weight:600;font-size:.85rem;float:right;margin-top:6px}
.sh-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}
.sh-stats div{background:var(--yellow-s);border-radius:16px;padding:8px 2px;font-weight:700;font-size:1.15rem}
.sh-stats small{display:block;font-weight:600;font-size:.7rem;color:var(--muted)}
.sh-badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sh-b{text-align:center;font-weight:700;font-size:.72rem;line-height:1.1;border-radius:14px;padding:6px 2px;background:var(--bg)}
.sh-b .em{font-size:2rem;display:block;margin-bottom:2px}
.sh-b.off{background:transparent;border:3px dashed #D9CFB4;color:#A79E85}.sh-b.off .em{opacity:.3;filter:grayscale(1)}
.sh-land{border-radius:16px;padding:8px 10px;margin-top:8px;background:var(--cs)}
.sh-land>b{font-size:.95rem}.sh-land>b small{float:right;font-weight:700}
.sh-sec{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:.78rem;font-weight:600}
.sh-sec span{flex:0 0 38%}
.sh-sec i{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-style:normal}
.sh-sec i em{aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-size:1.1rem}
.sh-sec i em.off{background:transparent;border:2px dashed #C9BFA3}
.sh-sign{display:flex;gap:16px;margin-top:20px;font-size:.8rem;color:var(--muted);font-weight:600}
.sh-sign span{flex:1;border-top:2px solid var(--ink);padding-top:3px}
.sh-actions{display:grid;gap:4px;margin-top:10px}
@media print{
  @page{margin:10mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body>*:not(#modal){display:none!important}
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  #modal:not([hidden]){position:static!important;display:block!important;background:none!important;padding:0!important}
  .mbox{max-width:none!important;max-height:none!important;overflow:visible!important;background:#fff!important;padding:0!important}
  .sheet{border-width:4px;break-inside:avoid}
  .noprint{display:none!important}
}

/* teaching help, progress count, accessibility */
.hint.tip{color:var(--ink);background:var(--yellow-s);border-radius:18px;padding:8px 14px;margin-bottom:8px;font-size:1.02rem;line-height:1.3}
.why{display:flex;align-items:center;gap:10px;text-align:left;background:var(--green-s);border-radius:18px;padding:8px 8px 8px 14px;margin-bottom:10px;font-weight:600;font-size:1rem;line-height:1.3}
.why span{flex:1}
.why .mini{flex:0 0 auto}
.worked{margin-top:12px;background:var(--yellow-s);border:4px dashed var(--yellow-d);border-radius:22px;padding:10px 14px;text-align:left}
.worked .wk{display:flex;justify-content:space-between;align-items:center;gap:8px}
.worked p{font-weight:600;font-size:1.05rem;line-height:1.4;margin-top:4px}
.twin{text-align:center;font-weight:700;color:var(--purple-d);background:var(--purple-s);border-radius:20px;padding:6px 14px;margin:0 auto 10px;width:max-content;max-width:100%}
.helprow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.helprow:empty{display:none}
.helprow .btn{margin:0}
.pn{align-self:center;font-weight:700;font-size:.85rem;color:var(--muted);margin-left:8px;white-space:nowrap}
.vis .sc{display:inline-block;transform:translate(var(--x),var(--y)) rotate(var(--r));margin:0 3px}
.rest{background:var(--blue-s);border-radius:20px;padding:10px 14px;font-weight:700;margin-top:12px}
.boostbtn.memory{background:var(--purple);box-shadow:0 7px 0 var(--purple-d)}
.boostbtn.memory:active{box-shadow:0 1px 0 var(--purple-d)}
.sh-note{margin-top:10px;background:var(--green-s);border-radius:16px;padding:8px 12px;font-size:.85rem;font-weight:600;line-height:1.35}
.rp-list{margin:4px 0 0 18px;font-weight:600;line-height:1.5}.rp-list small,.rp-what{color:var(--muted);font-weight:600;font-size:.85rem}
.rp-none{color:var(--muted);font-weight:600;font-size:.9rem}
.rp-bars{display:flex;align-items:flex-end;gap:4px;height:46px}
.rp-bars i{flex:1;background:#E7E0CB;border-radius:4px}.rp-bars i.on{background:var(--green-d)}
.rp-note{margin-top:14px;font-size:.78rem;color:var(--muted);font-weight:600;line-height:1.4}
.opt.right::before{content:"✔ "}.opt.wrong::before{content:"✖ "}
.mini{min-width:44px;min-height:44px}
/* text can be selected, copied and read aloud by assistive tools */
.intro,.qt,.story p,.b-text,.hint,.why,.worked p,.sheet,.hsub,.lblurb,.card p,.rp-note{-webkit-user-select:text;user-select:text}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

const norm=s=>s.replace(/️/g,'');
const has=e=>!!ART[norm(e||'')];
function svg(key,cls){const b=ART[norm(key)];return b?`<svg class="ic ${cls||''}" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g class="hd">${b}</g></svg>`:''}
const RE=/(?:\p{Extended_Pictographic}️?(?:‍\p{Extended_Pictographic}️?)*)|☆/gu;
const SKIP=/^(SCRIPT|STYLE|TEXTAREA|OPTION|TITLE|TEXT)$/;
function artify(root){
  if(!root||!root.nodeType)return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentNode;if(!p||SKIP.test(p.nodeName)||(p.closest&&p.closest('svg')))return NodeFilter.FILTER_REJECT;
    RE.lastIndex=0;return RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const list=[];while(tw.nextNode())list.push(tw.currentNode);
  list.forEach(n=>{

const lc=keys=>keys.map(k=>[k+' '+k.toLowerCase(),L[k][0]+' '+cap(L[k][1]),`${k}. ${k} is for ${L[k][1]}.`]);

function LS(title,emoji,intro,cards,src){return {title,emoji,intro,cards:cards||[],gen:typeof src==='function'?src:null,pool:Array.isArray(src)?src:null,make:null}}
function LM(title,emoji,intro,cards,make){return {title,emoji,intro,cards:cards||[],gen:null,pool:null,make}}
function makeSession(l,n=5){
  if(l.make)return l.make();
  if(l.pool)return {qs:sh(l.pool).slice(0,n).map(a=>mc(...a))};
  const seen=new Set(),qs=[];let t=0;
  while(qs.length<n){const q=l.gen(),k=q.text+'|'+q.vis+'|'+q.ans;if(seen.has(k)&&t++<80)continue;seen.add(k);qs.push(q)}
  return {qs};
}

   App state and learner profiles
   ---------------------------------------------------------------------
   localStorage layout (key "stepup-v2"):
     {
       v: 2,
       active: "<profile id>",
       order:  ["<id>", ...],              // display order of learners
       profiles: { "<id>": { ...PROFILE_DEF fields } },
       dev: { ...DEVICE_DEF fields }       // sound, voice... shared by everyone

   the rest of the app can keep reading and writing S.xp, S.sound, etc.
   save() splits S back into the right buckets.
   ===================================================================== */
const DB_KEY = 'stepup-v2';
const OLD_KEY = 'stepup-v1';            // single-child saves from earlier versions

/** Everything that belongs to one child. */
const PROFILE_DEF = {
  name: '', avatar: '🦊',
  xp: 0, streak: 0, best: 0, last: '', days: {},
  done: {}, badges: {}, teacher: false,
  daily: '', dailyDone: false, maxCombo: 0,
  resume: null,
  stats: {},          // accuracy per lesson: { [lessonId]: { n, w, r: [recent misses, 1 = missed] } }
  skills: {},         // mastery evidence per lesson: { [lessonId]: { o, k, s, last, dem } }  (see js1b_learn.js)
  rev: {},            // delayed-review schedule, kept apart from rewards: { [lessonId]: { due, step } }
  pre: false,         // has the starter quiz been taken?
  startIdx: 0         // index of the first lesson of the child's starting land
};
/** Settings that belong to the device, not to a child. */

const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/** Copy only the keys named in `def` that exist on `src`. */
function pickKeys(src, def) {
  const out = {};
  Object.keys(def).forEach(k => { if (src && src[k] !== undefined) out[k] = src[k]; });
  return out;
}
function readJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}

const isObj = o => o && typeof o === 'object' && !Array.isArray(o);

/** Make one saved learner safe to use: right types, missing fields filled in, nothing removed. */
function sanitize(p) {
  const out = Object.assign(clone(PROFILE_DEF), isObj(p) ? p : {});
  ['days', 'done', 'badges', 'stats', 'skills', 'rev'].forEach(k => { if (!isObj(out[k])) out[k] = {}; });
  ['xp', 'streak', 'best', 'maxCombo', 'startIdx'].forEach(k => { out[k] = Number.isFinite(+out[k]) ? +out[k] : 0; });
  ['name', 'avatar', 'last', 'daily'].forEach(k => { if (typeof out[k] !== 'string') out[k] = PROFILE_DEF[k]; });
  if (!out.avatar) out.avatar = PROFILE_DEF.avatar;

}

/** Keep a copy of data we could not understand, so it is never silently lost. */
function keepBackup(raw) {
  try { localStorage.setItem('stepup-backup-' + Date.now(), raw); return true; } catch (e) { return false; }
}
let dbNotice = '';            // shown to the grown-up once the app is up

/** Load the database, creating it (and migrating a v1 save) when needed. */
function loadDB() {
  let raw = null;
  try { raw = localStorage.getItem(DB_KEY); } catch (e) { /* storage blocked */ }
  if (raw) {
    let db = null;
    try { db = JSON.parse(raw); } catch (e) { /* damaged */ }
    if (db && db.v === 2 && isObj(db.profiles) && Object.keys(db.profiles).length) {
      // repair rather than discard: keep every learner that is still readable
      const ids = (Array.isArray(db.order) ? db.order : []).filter(id => isObj(db.profiles[id]));
      Object.keys(db.profiles).forEach(id => { if (!ids.includes(id) && isObj(db.profiles[id])) ids.push(id); });
      if (ids.length) {
        const profiles = {};
        ids.forEach(id => { profiles[id] = sanitize(db.profiles[id]); });
        return { v: 2, active: profiles[db.active] ? db.active : ids[0], order: ids, profiles, dev: Object.assign(clone(DEVICE_DEF), pickKeys(db.dev, DEVICE_DEF)) };
      }
    }
    keepBackup(raw);
    dbNotice = 'Some saved data could not be read, so a safe copy was kept on this device.';
  }

  const old = readJSON(OLD_KEY);
  const id = newId();
  const profile = sanitize(pickKeys(isObj(old) ? old : {}, PROFILE_DEF));
  if (Object.keys(profile.done).length) profile.pre = true;      // existing progress: skip the starter quiz
  return {
    v: 2, active: id, order: [id], profiles: { [id]: profile },
    dev: Object.assign(clone(DEVICE_DEF), pickKeys(isObj(old) ? old : {}, DEVICE_DEF))
  };
}
let DB = loadDB();

function buildState(id) {
  return Object.assign(sanitize(clone(DB.profiles[id])), clone(Object.assign({}, DEVICE_DEF, DB.dev)));
}
let S = buildState(DB.active);

/** Write S back into the database. */
let lastSaved = '', saveFailed = false;
function save() {
  DB.profiles[DB.active] = pickKeys(S, PROFILE_DEF);
  DB.dev = pickKeys(S, DEVICE_DEF);
  const json = JSON.stringify(DB);
  if (json === lastSaved) return true;                       // nothing changed: no needless write
  try {
    localStorage.setItem(DB_KEY, json);
    lastSaved = json;
    saveFailed = false;
    return true;
  } catch (e) {                                              // private mode or storage full: keep playing
    if (!saveFailed && typeof toast === 'function') toast('Progress cannot be saved on this device right now.');
    saveFailed = true;
    return false;
  }
}

/** Summary list used by the switcher (the active learner is read live from S). */
function learners() {
  return DB.order.map(id => Object.assign({ id }, id === DB.active ? pickKeys(S, PROFILE_DEF) : DB.profiles[id]));
}
function switchProfile(id) {
  if (!DB.profiles[id] || id === DB.active) return;
  TTS.stop();
  save();
  DB.active = id;
  S = buildState(id);
  save();
  openCh = null;
}
function addProfile(name, avatar) {
  save();
  const id = newId();
  DB.profiles[id] = Object.assign(clone(PROFILE_DEF), { name, avatar });
  DB.order.push(id);
  DB.active = id;
  S = buildState(id);
  save();
  openCh = null;
  return id;
}
/** Remove the active learner. Returns false when it is the only one. */
function removeActiveProfile() {
  if (DB.order.length < 2) return false;
  const id = DB.active;
  DB.order = DB.order.filter(x => x !== id);
  delete DB.profiles[id];
  DB.active = DB.order[0];
  S = buildState(DB.active);
  save();
  openCh = null;
  return true;
}
/** Erase progress for the active learner but keep their name and avatar. */
function resetActiveProfile() {
  Object.assign(S, clone(PROFILE_DEF), { name: S.name, avatar: S.avatar });
  save();
  openCh = null;
}

/* ---------------------------------------------------------------------
   Ollie's caption bubble.
   Every speech path (Edge audio, browser voice, silent timer) reports its
   progress through prog() / charProg() / sim(), so the highlighted word
   always follows what is being said and the bubble can never get stuck.
   --------------------------------------------------------------------- */
const Buddy = {
  words: [], starts: [], total: 1,
  idx: -1,          // last highlighted word (-1 = none yet)
  active: false,    // true while a phrase is "being spoken"
  simOn: false,     // true while the silent timer drives the highlight
  timer: 0, hideT: 0, raw: '',

  inLesson() { return document.body.classList.contains('inlesson'); },

  /** Show a phrase in the bubble and make Ollie start talking. */
  start(text) {

    this.raw = text; this.active = true; this.idx = -1;

    const re = /\S+/g;
    let m;
    while ((m = re.exec(text))) { this.words.push(m[0]); this.starts.push(m.index); }
    this.total = text.length || 1;
    $('#b-text').innerHTML = this.words.map(w => `<span class="w">${esc(w)}</span>`).join(' ');
    $('#b-bubble').hidden = !S.captions;
    const b = $('#buddy');
    b.hidden = false;
    b.classList.add('talking');
    $('#b-text').scrollTop = 0;
    this.mark(-1);
  },

  /** Highlight word i. Only moves forward, so two progress sources can never make it flicker. */
  mark(i) {
    if (i !== -1 && i < this.idx) return;
    this.idx = i;
    const box = $('#b-text'), spans = box.children;
    for (let j = 0; j < spans.length; j++) spans[j].className = 'w' + (j < i ? ' done' : j === i ? ' cur' : '');
    if (i >= 0 && spans[i]) box.scrollTop = Math.max(0, spans[i].offsetTop - box.clientHeight / 2);
  },
  /** Progress as a fraction (0..1) of the whole phrase, e.g. audio.currentTime / duration. */
  prog(f) { this.charProg(Math.min(1, Math.max(0, f)) * this.total); },
  /** Progress as a character offset into the phrase, e.g. SpeechSynthesis boundary events. */
  charProg(ci) {
    let i = 0;
    for (let j = 0; j < this.starts.length; j++) if (this.starts[j] <= ci) i = j;
    this.mark(i);
  },

  /** Silent timer: highlights words from `from` onward at roughly reading speed. */
  sim(from = 0) {
    this.stopSim();
    if (!this.active) return;
    const perChar = S.rate === '-30%' ? 85 : S.rate === '+0%' ? 52 : 66;       // ms per character
    const startChar = this.starts[from] || 0;
    const remaining = Math.max(1, this.total - startChar);
    const ms = Math.max(900, remaining * perChar), t0 = Date.now();
    this.simOn = true;
    this.timer = setInterval(() => {
      const f = (Date.now() - t0) / ms;
      if (f >= 1) this.end();
      else this.charProg(startChar + f * remaining);
    }, 60);
  },
  stopSim() { clearInterval(this.timer); this.simOn = false; },

  /** Phrase finished (safe to call more than once). */
  end() {
    if (!this.active) return;
    this.active = false;
    this.stopSim();
    $('#buddy').classList.remove('talking');
    this.mark(this.words.length);
    if (!this.inLesson()) this.hideT = setTimeout(() => { $('#buddy').hidden = true; $('#b-bubble').hidden = true; }, 3500);
  },
  /** Interrupted by a newer phrase or by closing the lesson. */
  halt() { this.stopSim(); this.active = false; $('#buddy').classList.remove('talking'); },

  mood(m) {

/* ---------------------------------------------------------------------
   Text-to-speech with graceful fallbacks, best first:
     1. Edge TTS from server.py (cached per phrase)
     2. the device's own voice (speechSynthesis)
     3. silence, with Ollie's words still highlighted by a timer

   Ollie had reached, so the caption never freezes or restarts.
   --------------------------------------------------------------------- */

  down: 0,                       // do not contact the server again before this time (ms)
  fails: 0,                      // consecutive failures, drives the back-off
  base: window.TTS_BASE || '',

  serverUsable() { return !(location.protocol === 'file:' && !this.base) && Date.now() >= this.down; },
  markUp() {

  },
  markDown() {

    this.down = Date.now() + Math.min(60000, 4000 * Math.pow(2, Math.min(this.fails, 4)));
    if (this.online !== false) { this.online = false; this.refreshStatus(); }

  refreshStatus() { if (view === 'me' && $('#lesson').hidden) renderMe(); },

  /** Fetch (or reuse) the audio for a phrase. Rejects on timeout, error or empty audio. */
  async url(t) {
    const k = this.key(t);
    if (this.cache.has(k)) return this.cache.get(k);
    if (!this.serverUsable()) throw new Error('server unavailable');
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), this.TIMEOUT);
    try {
      const res = await fetch(this.base + '/api/tts?' + new URLSearchParams({ text: t, voice: S.voice, rate: S.rate }), { signal: ctl.signal });
      if (!res.ok) throw new Error('http ' + res.status);
      const blob = await res.blob();
      if (!blob.size) throw new Error('empty audio');
      const u = URL.createObjectURL(blob);
      this.cache.set(k, u);
      this.markUp();
      return u;
    } catch (e) {
      this.markDown();
      throw e;
    } finally {
      clearTimeout(timer);
    }

  stop() {
    this.id++;
    clearTimeout(this.safety);
    Buddy.halt();
    if (this.cur) { try { this.cur.pause(); } catch (e) { /* already gone */ } this.cur = null; }
    try { speechSynthesis.cancel(); } catch (e) { /* no speech support */ }
  },

  /** `local` = keep the words on this device (use the device voice, never the Edge server), e.g. when they contain a child's name. */
  async speak(raw, local = false) {
    const text = clean(raw);
    if (!text) return;
    this.stop();
    const id = this.id;
    Buddy.start(text);
    // Last line of defence: whatever happens, the bubble stops "talking" eventually.
    this.safety = setTimeout(() => { if (id === this.id) Buddy.end(); }, 6000 + text.length * 180);

    if (!S.sound) { Buddy.sim(0); return; }

    let url = null;
    if (!local) { try { url = await this.url(text); } catch (e) { /* offline or slow: fall back below */ } }
    if (id !== this.id) return;                              // a newer phrase took over
    if (url && await this.playAudio(url, id)) return;        // played (or was superseded)
    if (id !== this.id) return;
    this.fallback(text, id, Math.max(0, Buddy.idx));         // continue from the last word shown
  },

  /** Play Edge audio. Resolves true when done or superseded, false when it failed and a fallback is needed. */
  playAudio(url, id) {
    return new Promise(resolve => {
      const a = new Audio(url);
      this.cur = a;
      let settled = false, watchdog = 0;
      const finish = ok => {
        if (settled) return;
        settled = true;
        clearTimeout(watchdog);
        if (!ok) { try { a.pause(); } catch (e) { /* ignore */ } if (this.cur === a) this.cur = null; }
        resolve(ok);
      };
      const arm = ms => { clearTimeout(watchdog); watchdog = setTimeout(() => finish(false), ms); };

      a.onended = () => { if (id === this.id) Buddy.end(); finish(true); };
      a.onerror = () => finish(false);
      a.onwaiting = a.onstalled = () => arm(2500);           // buffering: give it a moment, then give up
      a.ontimeupdate = () => {
        if (id !== this.id) { finish(true); return; }
        const d = isFinite(a.duration) && a.duration > 0 ? a.duration : 0;
        if (d) Buddy.prog(a.currentTime / d);
        else if (!Buddy.simOn) Buddy.sim(Math.max(0, Buddy.idx));   // unknown length: time it ourselves
        arm(2500);
      };
      arm(4000);                                             // never even started

      a.play().catch(e => {
        if (e && e.name === 'NotAllowedError') { Buddy.sim(0); finish(true); }   // browser blocks sound until a tap: captions only
        else finish(false);
      });
    });
  },

  /** Device voice, with the timer keeping the highlight moving. Resumes at word `from`. */
  fallback(text, id, from) {
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
      if (!this.noVoiceNote && typeof toast === 'function') { this.noVoiceNote = true; toast('No voice on this device. Ollie shows the words instead.'); }
      Buddy.sim(from); return;
    }
    const offset = Buddy.starts[from] || 0;
    const u = new SpeechSynthesisUtterance(text.slice(offset));
    u.rate = .85; u.pitch = 1.15; u.lang = 'en-US';

      if (id !== this.id) return;

    };
    u.onend = () => { if (id === this.id) Buddy.end(); };
    u.onerror = () => { if (id === this.id) Buddy.sim(Math.max(0, Buddy.idx)); };
    try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { Buddy.sim(from); return; }
    Buddy.sim(from);                                         // many voices send no boundary events: estimate until they do
  },

  async prefetch(list) {
    const q = [...new Set(list.map(clean).filter(Boolean))];
    const run = async () => { while (q.length) { try { await this.url(q.shift()); } catch (e) { return; } } };
    run(); run();
  },

  /** Ask the server whether it is alive. */
  async check() {

    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 3000);

  retry() { this.down = 0; this.fails = 0; return this.check(); }
};

  const fx=$('#fx'),em=['⭐','🎈','✨','🌟'],cols=['#FF8A78','#FFD34E','#6FD08C','#4FB3F0','#B28CF0','#FF9EC4'];
  for(let i=0;i<40;i++){
    const s=document.createElement('span');
    if(i%2){s.textContent=pick(em)}else{s.style.cssText=`width:12px;height:16px;border-radius:4px;background:${pick(cols)}`}
    s.style.left=R(0,98)+'%';s.style.animationDelay=(Math.random()*.9)+'s';s.style.animationDuration=(2+Math.random()*1.6)+'s';
    fx.appendChild(s);setTimeout(()=>s.remove(),4600);
  }
}

/* =====================================================================
   Learning engine: evidence, mastery, review and teaching help
   ---------------------------------------------------------------------
   Everything here is simple, rule-based and deterministic. It is a rough
   guide for grown-ups, not an assessment, and it never changes lesson
   completion, XP, stickers or streaks.

   Evidence we keep per lesson skill (S.skills[lessonId]):
     o     last 10 outcomes: 0 = right on its own, 1 = right after a hint or a retry,
           2 = needed the worked example
     k     different questions answered right on their own (variety)
     s     recently seen questions (so new examples are preferred)
     d     days on which the skill was practised
     last  date of the last practice
     dem   date the skill was first shown on its own across days and examples
   Review dates live apart from rewards in S.rev[lessonId] = { due, step }.
   ===================================================================== */
const WINDOW = 10;
const OUTCOMES_MAX = 10, KEYS_MAX = 14, SEEN_MAX = 24, DAYS_MAX = 6;
const MIN_ANSWERS = 5;                 // never judge on fewer answers than this
const MIN_VARIETY = 4;                 // ...or on fewer different questions
const MIN_DAYS = 2;                    // ...or on a single day
const REVIEW_GAPS = [3, 7, 14, 30];    // days until the next review after each successful one
const WELCOME_BACK_DAYS = 3;

const addDays = n => ds(dayOff(n));
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5);
const qKey = q => q.text + '|' + q.vis + '|' + q.ans;
const lessonById = id => ALL.find(l => l.id === id);
const pushCap = (arr, v, max) => { arr.push(v); while (arr.length > max) arr.shift(); };

/* ---- accuracy per lesson (existing stat, kept as it was) ---- */
function recordResult(lid, missed) {
  if (!lid) return;
  const s = S.stats[lid] || (S.stats[lid] = { n: 0, w: 0, r: [] });
  s.n++; if (missed) s.w++;
  s.r.push(missed ? 1 : 0); if (s.r.length > WINDOW) s.r.shift();
}
const missRate = st => st && st.r.length ? st.r.reduce((a, b) => a + b, 0) / st.r.length : 0;
/** Lessons the child keeps getting wrong (needs 3+ recent answers and 40%+ misses). */
function weakLessons(max = 3) {
  return ALL.filter(l => !l.make && S.stats[l.id] && S.stats[l.id].r.length >= 3 && missRate(S.stats[l.id]) >= .4)
    .sort((a, b) => missRate(S.stats[b.id]) - missRate(S.stats[a.id]) || S.stats[b.id].w - S.stats[a.id].w).slice(0, max);
}

/* ---- mastery evidence ---- */
function skillOf(lid) { return S.skills[lid] || (S.skills[lid] = { o: [], k: [], s: [], d: [], last: '', dem: '' }); }
/** Outcome of one answered question: 0 independent, 1 with a hint or retry, 2 needed the worked example. */
const outcomeOf = q => q.worked ? 2 : (q.w || q.hinted) ? 1 : 0;

function recordOutcome(q) {
  if (!q.lid) return;
  const out = outcomeOf(q), sk = skillOf(q.lid), key = qKey(q), t = today();
  pushCap(sk.o, out, OUTCOMES_MAX);
  if (out === 0 && !sk.k.includes(key)) pushCap(sk.k, key, KEYS_MAX);
  if (!sk.s.includes(key)) pushCap(sk.s, key, SEEN_MAX);
  if (!sk.d.includes(t)) pushCap(sk.d, t, DAYS_MAX);
  sk.last = t;
  recordResult(q.lid, !!q.w);
  if (!sk.dem && levelOf(q.lid) === 'demonstrating') sk.dem = t;
}

/** new | emerging | practicing | demonstrating  (new = not enough evidence to say anything). */
function levelOf(lid) {
  const sk = S.skills[lid];
  if (!sk || sk.o.length < 3) return 'new';
  const recent = sk.o.slice(-8), rate = recent.filter(x => x === 0).length / recent.length;
  if (sk.o.length >= MIN_ANSWERS && rate >= .8 && sk.k.length >= MIN_VARIETY && sk.d.length >= MIN_DAYS) return 'demonstrating';
  return rate < .4 ? 'emerging' : 'practicing';
}
const isDue = lid => !!S.rev[lid] && S.rev[lid].due <= today();
/** Adds "review" (was shown on its own before, now due for a refresher) on top of levelOf. */
function masteryOf(lid) {
  const lv = levelOf(lid), sk = S.skills[lid];
  return sk && sk.dem && isDue(lid) && lv !== 'emerging' ? 'review' : lv;
}

/** After a session: decide when each practised skill should come back. */
function scheduleAfter(lid) {
  const lv = levelOf(lid), r = S.rev[lid], t = today();
  if (lv === 'emerging') {
    const due = addDays(1);
    S.rev[lid] = { due: r && r.due < due ? r.due : due, step: 0 };
  } else if (lv === 'practicing') {
    if (!r) S.rev[lid] = { due: addDays(2), step: 0 };
    else if (r.due <= t) S.rev[lid] = { due: addDays(2), step: 0 };          // review was shaky: shorter gap
  } else if (lv === 'demonstrating') {
    let step = r ? r.step : 0;
    if (r && r.due <= t) step = Math.min(step + 1, REVIEW_GAPS.length - 1);  // review went well: wait longer
    if (!r || r.due <= t) S.rev[lid] = { due: addDays(REVIEW_GAPS[step]), step };
  }
}
function endSession(qs) {
  [...new Set(qs.map(q => q.lid).filter(Boolean))].forEach(scheduleAfter);
}

/** Skills that are due for a refresher (up to `max`), most overdue first. Tricky ones are left to Practice Boost. */
function dueSkills(max = 3) {
  const t = today(), weak = new Set(weakLessons(6).map(l => l.id));
  const due = Object.keys(S.rev).filter(id => S.rev[id].due <= t && !weak.has(id)).sort((a, b) => S.rev[a].due.localeCompare(S.rev[b].due))
    .map(lessonById).filter(l => l && !l.make);
  if (due.length) return due.slice(0, max);
  // coming back after a break: refresh the lessons not practised for the longest time
  if (S.last && daysBetween(S.last, today()) >= WELCOME_BACK_DAYS) {
    return ALL.filter(l => !l.make && isDone(l) && !weak.has(l.id))
      .sort((a, b) => ((S.skills[a.id] || {}).last || '').localeCompare((S.skills[b.id] || {}).last || '')).slice(0, max);
  }
  return [];
}
const cameBack = () => !!S.last && cntDone() > 0 && daysBetween(S.last, today()) >= WELCOME_BACK_DAYS;

/* ---- picking questions ---- */
function tagQs(qs, lid) { qs.forEach(q => { q.lid = lid; }); return qs; }

/** New examples for a lesson: prefers questions the child has not seen recently. */
function freshQs(l, n) {
  const seen = new Set((S.skills[l.id] || {}).s || []);
  if (l.pool) {
    const ent = sh(l.pool).map(a => ({ a, k: a[0] + '|' + (a[1] || '') + '|' + String(a[2]) }));
    ent.sort((x, y) => seen.has(x.k) - seen.has(y.k));
    return ent.slice(0, n).map(e => mc(...e.a));
  }
  const qs = [], keys = new Set(); let t = 0;
  while (qs.length < n) {
    const q = l.gen(), k = qKey(q);
    if (keys.has(k) && t++ < 80) continue;
    if (seen.has(k) && t++ < 40) continue;
    keys.add(k); qs.push(q);
  }
  return qs;
}
function sessionOf(l, n = 5) {
  const ses = l.make ? makeSession(l, n) : { qs: freshQs(l, n) };
  tagQs(ses.qs, l.id);
  return ses;
}
/** The step just before `l` in the same section, used as an easier example. */
function easierStep(l) {
  const p = ALL[l.idx - 1];
  return p && p.ch === l.ch && p.sec === l.sec && !p.make ? p : null;
}
/** Questions for a list of lessons. Skills that are still emerging also get one easier example. */
function questionsFor(lessons, total) {
  if (!lessons.length) return null;
  const per = Math.ceil(total / lessons.length), qs = [];
  lessons.forEach(l => {
    const easy = per >= 2 && levelOf(l.id) === 'emerging' ? easierStep(l) : null;
    qs.push(...sessionOf(l, easy ? per - 1 : per).qs);
    if (easy) { const q = sessionOf(easy, 1).qs[0]; q.easier = true; qs.push(q); }
  });
  return sh(qs).slice(0, total);
}
const uniqueLessons = list => list.filter((l, i) => list.findIndex(x => x.idx === l.idx) === i);
/** Practice Boost: only the tricky skills. */
const boostQuestions = total => questionsFor(weakLessons(3), total);
/** Memory Check: skills that are due for a refresher, with fresh examples. */
const memoryQuestions = total => questionsFor(dueSkills(3), total);
/** Quick Review before a lesson: tricky skills first, then due ones, never the lesson itself. */
function warmQuestions(total, except) {
  const list = uniqueLessons([...weakLessons(3), ...dueSkills(3)]).filter(l => !except || l.idx !== except.idx).slice(0, 3);
  return questionsFor(list, total);
}
/** Two starter-quiz questions for land `ci`, taken from early and late in that land. */
function pretestQs(ci) {
  const pool = ALL.filter(l => l.ch === ci && !l.make);
  return [pool[Math.floor(pool.length * .25)], pool[Math.floor(pool.length * .7)]].map(l => sessionOf(l, 1).qs[0]);
}
/** A different question on the same skill, to check that an explanation sank in. */
function twinOf(q) {
  const l = lessonById(q.lid);
  if (!l || l.make) return null;
  for (let i = 0; i < 30; i++) {
    const t = freshQs(l, 1)[0];
    if (qKey(t) !== qKey(q)) { t.lid = l.id; t.twin = true; return t; }
  }
  return null;
}

/* =====================================================================
   Teaching help, written from the question itself.
   Teach.info(q, story) -> { hint, why, worked }; any part may be null.
   The lesson data is untouched: questions that match no pattern simply
   get no extra help (the old behaviour), so nothing generic is ever shown.
   ===================================================================== */
const Teach = (() => {
  const W = n => (NN[n] !== undefined ? NN[n] : String(n));
  const seq = (from, to) => { const o = []; for (let i = from; i <= to; i++) o.push(i); return o; };
  const countList = n => (n <= 20 ? seq(1, n).map(W) : seq(1, n)).join(', ');
  const emojiCount = s => {
    const t = s.replace(/[\s|+]/g, '');
    try { return [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(t)].length; } catch (e) { return [...t].length; }
  };
  const suffix = (a, b) => { let i = 0; while (i < a.length && i < b.length && a[a.length - 1 - i] === b[b.length - 1 - i]) i++; return a.slice(a.length - i); };
  const spelled = w => w.split('').join(' - ');
  const num = s => +s;
  const out = (hint, why, worked) => ({ hint: hint || null, why: why || null, worked: worked || null });

  /** Find the story sentence that holds the answer. */
  function fromStory(q, story, sentence) {
    const sentences = story.replace(/\n/g, ' ').match(/[^.!?]+[.!?"]*/g) || [];
    const a = String(q.ans).toLowerCase().replace(/[^\w ]/g, '');
    const hit = a && sentences.find(s => new RegExp('\\b' + a.replace(/ /g, '\\s+') + '\\b', 'i').test(s));
    const look = sentence ? 'Read the sentence again. Which part tells you the answer?' : 'Look back at the story. Tap the speaker to hear it again, then find the part that tells you.';
    if (!hit) return out(look, null, null);
    const line = hit.trim();
    return out(look, `${sentence ? 'It says' : 'The story says'}: "${line}"`, `${sentence ? 'Let us read it again together.' : 'Let us look back at the story together.'} This part tells us: "${line}" So the answer is ${q.ans}.`);
  }

  function info(q, story) {
    if (!q) return out();
    const t = q.text || '', v = q.vis || '', a = String(q.ans), say = q.say || '';
    let m;
    if (story) return fromStory(q, story);

    if (q.type === 'spell') {
      const w = q.word;
      return out(`The word starts with "${w[0]}". Say it slowly and listen to each sound.`, `${spelled(w)} spells ${w}.`,
        `Let us build it one sound at a time: ${spelled(w)}. Now tap the letters in that order.`);
    }

    /* ---------- numbers ---------- */
    if (t === 'How many are there?') {
      const n = num(a), obj = (say.match(/^How many (.+) are there\?$/) || [])[1] || 'things';
      return out(`Touch each one as you count, and count every one only once.`, `Counting ${countList(n)}: the last number tells how many, so there are ${n}.`,
        `Count one by one: ${countList(n)}. The last number you say, ${W(n)}, is how many ${obj} there are.`);
    }
    if (t === 'How many altogether?' && v.includes('+')) {
      const [p1, p2] = v.split('+'), x = emojiCount(p1), y = emojiCount(p2), s = num(a);
      return out(`Count the first group. Then keep counting the second group.`, `${x} and ${y} more make ${s}: ${x} + ${y} = ${s}.`,
        `Count the first group: ${x}. Now count on ${y} more: ${seq(x + 1, x + y).join(', ')}. You stop at ${s}.`);
    }
    if (t === 'How many altogether?' && v.includes('|')) {
      const groups = v.split('|'), g = groups.length, n = emojiCount(groups[0]), s = num(a);
      const sums = seq(1, g).map(i => i * n);
      return out(`Count how many are in one group, then add up the groups.`, `${g} groups of ${n} make ${s}: ${Array(g).fill(n).join(' + ')} = ${s}.`,
        `Each group has ${n}. Add the groups one at a time: ${sums.join(', ')}. That makes ${s}.`);
    }
    if (t === 'What is the answer?' && (m = v.match(/^(\d+) \+ (\d+) = \?$/))) {
      const x = num(m[1]), y = num(m[2]), s = num(a);
      if (y <= 10) return out(`Start at ${x} and count up ${y} more.`, `${x} plus ${y} makes ${s}.`,
        `Picture ${x} blocks, then ${y} more blocks. Start at ${x} and count on: ${seq(x + 1, x + y).join(', ')}. You land on ${s}.`);
      const ty = Math.floor(y / 10) * 10, oy = y - ty;
      return out(`Add the tens first, then the ones.`, `${x} + ${y} = ${s}.`,
        `First add the tens: ${x} + ${ty} = ${x + ty}. Then add the ones: ${x + ty} + ${oy} = ${s}.`);
    }
    if (t === 'What is the answer?' && (m = v.match(/^(\d+) − (\d+) = \?$/))) {
      const x = num(m[1]), y = num(m[2]), s = num(a);
      if (y <= 10) return out(`Start at ${x} and count back ${y}.`, `${x} take away ${y} leaves ${s}.`,
        `Picture ${x} blocks and take ${y} away. Start at ${x} and count back: ${seq(1, y).map(i => x - i).join(', ')}. You land on ${s}.`);
      const ty = Math.floor(y / 10) * 10, oy = y - ty;
      return out(`Take away the tens first, then the ones.`, `${x} − ${y} = ${s}.`,
        `First take away the tens: ${x} − ${ty} = ${x - ty}. Then take away the ones: ${x - ty} − ${oy} = ${s}.`);
    }
    if (t === 'What is the answer?' && (m = v.match(/^(\d+) × (\d+) = \?$/))) {
      const k = num(m[1]), n = num(m[2]), s = num(a);
      return out(`Think of ${k} groups with ${n} in each group.`, `${k} groups of ${n} make ${s}.`,
        `Count by ${n}s, ${k} times: ${seq(1, k).map(i => i * n).join(', ')}. The last number is ${s}.`);
    }
    if (t === 'How many more make 10?' && (m = v.match(/^(\d+) \+ \? = 10$/))) {
      const x = num(m[1]);
      return out(`Count up from ${x} to 10 and notice how many steps you take.`, `${x} + ${10 - x} = 10.`,
        `Start at ${x}. Count up to ten: ${seq(x + 1, 10).join(', ')}. That took ${10 - x} steps, so ${10 - x} more make 10.`);
    }
    if ((m = t.match(/^A candy costs ₱(\d+)\. You pay ₱(\d+)/))) {
      const c = num(m[1]), p = num(m[2]);
      return out(`Change is what is left over. Take the cost away from what you pay.`, `${p} − ${c} = ${p - c}, so the change is ₱${p - c}.`,
        `You pay ${p} and the candy costs ${c}. Count up from ${c} to ${p}: that is ${p - c} more. Your change is ₱${p - c}.`);
    }
    if (t === 'How many pesos altogether?' && (m = v.match(/₱(\d+) \+ ₱(\d+)/))) {
      const x = num(m[1]), y = num(m[2]);
      return out(`Add the two peso amounts together.`, `₱${x} + ₱${y} = ${a}.`, `Start with ${x} pesos and add ${y} more: ${x} + ${y} = ${num(x + y)}.`);
    }
    if (t === 'Which number is bigger?' || t === 'Which number is smaller?') {
      const nums = v.trim().split(/\s+/).map(Number), lo = Math.min(...nums), hi = Math.max(...nums), big = /bigger/.test(t);
      return out(`The number you say later when you count up is the bigger one.`, big ? `${hi} comes after ${lo} when we count, so ${hi} is bigger.` : `${lo} comes before ${hi} when we count, so ${lo} is smaller.`,
        `Count up: ${seq(lo, hi).join(', ')}. ${hi} comes later, so ${hi} is bigger and ${lo} is smaller.`);
    }
    if (t === 'What number comes next?' && (m = v.match(/^(\d+), (\d+), (\d+), \?$/))) {
      const x = num(m[1]), y = num(m[2]), z = num(m[3]), d = y - x;
      return out(`Look at how much the numbers go up each time.`, `Each number goes up by ${d}, so ${z} + ${d} = ${a}.`,
        `${x}, ${y}, ${z}: each step goes up by ${d}. So the next number is ${z} + ${d} = ${a}.`);
    }
    if (t === 'What comes next?' && (m = v.match(/^(\d+), (\d+), (\d+), \?$/))) {
      const x = num(m[1]), y = num(m[2]), z = num(m[3]), d = y - x;
      return out(`Count by ${d}s. How much does each number go up?`, `Counting by ${d}s: ${z} + ${d} = ${a}.`, `${x}, ${y}, ${z}: each step goes up by ${d}. So we add ${d} to ${z} and get ${a}.`);
    }
    if ((m = t.match(/^What number comes (before|after) (\d+)\?$/))) {
      const n = num(m[2]), bef = m[1] === 'before';
      return out(bef ? `Count back one from ${n}.` : `Count up one from ${n}.`, bef ? `${a} comes right before ${n}.` : `${a} comes right after ${n}.`,
        bef ? `Count up: ${seq(num(a), n).join(', ')}. ${a} is just before ${n}.` : `Count up: ${seq(n, num(a)).join(', ')}. ${a} comes right after ${n}.`);
    }
    if ((m = t.match(/^What number is between (\d+) and (\d+)\?$/)) || (t === 'Which number is missing?' && (m = v.match(/^(\d+), \?, (\d+)$/)))) {
      const x = num(m[1]), y = num(m[2]);
      return out(`Count up from ${x}. Which number do you say before ${y}?`, `Counting ${x}, ${a}, ${y}: ${a} fits in the middle.`, `Count up: ${seq(x, y).join(', ')}. The number in the middle is ${a}.`);
    }
    if ((m = t.match(/^How many (tens|ones) are in (\d+)\?$/))) {
      const n = num(m[2]), tens = Math.floor(n / 10), ones = n % 10;
      return out(`The first digit shows the tens. The last digit shows the ones.`, `${n} is ${tens} ${tens === 1 ? 'ten' : 'tens'} and ${ones} ${ones === 1 ? 'one' : 'ones'}.`,
        `${n} is made of ${tens} tens and ${ones} ones: ${tens * 10} + ${ones} = ${n}. You wanted the ${m[1]}, which is ${a}.`);
    }
    if ((m = t.match(/^(What is half of|What is a quarter of) (\d+)\?$/))) {
      const n = num(m[2]), parts = /half/.test(m[1]) ? 2 : 4;
      return out(`${parts === 2 ? 'Half means sharing into 2 equal groups.' : 'A quarter means sharing into 4 equal groups.'}`, `${n} shared into ${parts} equal groups gives ${a} in each group.`,
        `Share ${n} into ${parts} equal groups. Each group gets ${a}, because ${Array(parts).fill(a).join(' + ')} = ${n}.`);
    }
    if ((m = t.match(/^How many sides does a (square|triangle) have\?$/))) {
      return out(`Trace around the shape with your finger and count each straight side.`, `A ${m[1]} has ${a} sides.`, `Trace around the ${m[1]} and count each side: ${countList(num(a))}. A ${m[1]} has ${a} sides.`);
    }
    if (t === 'Which word is this number?' || t === 'Which number is this word?') {
      return out(`Say it out loud, then match the sound with the other form.`, `${v} and ${a} are the same number, written two ways.`, null);
    }
    if (t === 'What time is it?') return out(`The short hand points to the hour.`, `The short hand points to ${a.replace(" o'clock", '')}, so it is ${a}.`, null);
    if (/^Which clock shows/.test(t)) return out(`Find the clock where the short hand points to the hour you want.`, null, null);
    if (/^(.+ has \d+ .+|There are \d+ boxes)/.test(t) || /^[A-Z][a-z]+ has \d+ /.test(t) || /^There are \d+ boxes/.test(t)) {
      const ns = (t.match(/\d+/g) || []).map(Number);

/** Counting pictures are shown in different arrangements so children count instead of memorising a picture. */

  if(q.arr===1){const h=Math.ceil(items.length/2);return esc(items.slice(0,h).join(''))+'<br>'+esc(items.slice(h).join(''))}
  return items.map((it,i)=>`<span class="sc" style="--x:${(i*37%13)-6}px;--y:${(i*53%11)-5}px;--r:${(i*29%21)-10}deg">${esc(it)}</span>`).join('');

/** Warm, step-by-step help: hint on the first miss, a worked example on the next, then another try. */
function wrongHit(q,msg){

  sfx.no();Buddy.mood('oops');
  const info=Teach.info(q,P.story),spell=q.type==='spell',hintAt=spell?2:1,workAt=spell?4:2;
  let say=null;P.tip=false;

    const qc=document.querySelector('.qcard');
    if(qc&&!document.querySelector('.worked'))qc.insertAdjacentHTML('afterend',workedHTML(q));
    say='Let us work it out together. '+info.worked;
  }else if(info.hint&&q.w>=hintAt&&q.w<workAt&&!q.worked){
    P.hint=info.hint;P.tip=true;say=pick(['Not quite yet.','Good try!','Almost!'])+' '+info.hint;

/** The learner asks for help: first a hint, then the worked example. */

function buildPractice(kind){
  const match=l=>!l.make&&(kind==='letters'?l.sec<2:kind==='numbers'?l.sec===2:true);
  let pool=ALL.filter(l=>match(l)&&unlocked(l));
  if(kind==='letters'||kind==='numbers')pool=pool.filter(l=>l.sec===(kind==='numbers'?2:l.sec));
  if(!pool.length)pool=ALL.filter(match).slice(0,2);
  // Skills that need more practice come up a little more often; nothing is ever hidden.
  const wt=l=>({emerging:4,practicing:3,review:3}[masteryOf(l.id)]||1);
  const bag=[].concat(...pool.map(l=>Array(wt(l)).fill(l)));
  const n=kind==='daily'?6:8,qs=[],seen=new Set();let t=0;
  while(qs.length<n){
    const l=pick(bag),q=l.pool?mc(...pick(l.pool)):l.gen(),k=qKey(q);
    const old=((S.skills[l.id]||{}).s||[]).includes(k);
    if((seen.has(k)||old)&&t++<120)continue;
    seen.add(k);q.lid=l.id;qs.push(q);
  }
  // never show the same question twice in a row
  for(let i=1;i<qs.length;i++)if(qKey(qs[i])===qKey(qs[i-1])){const j=(i+1)%qs.length;[qs[i],qs[j]]=[qs[j],qs[i]]}
  return qs;
}

  const meta={daily:['Daily Challenge','📅'],letters:['Letter Blitz','🔤'],numbers:['Number Blitz','🔢'],mixed:['Mix It Up','🎲']}[k];
  startLesson({title:meta[0],emoji:meta[1],intro:'',cards:[],ch:null},k==='daily'?'daily':'practice',{qs:buildPractice(k)},{bonus:k==='daily'?30:0});
}
